{% extends "base.html" %}
{% block title %}Log In — NovaCart{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to your NovaCart account</p>

    {% if errors %}
    <div class="auth-errors">
      <ul>
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
      </ul>
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email" value="{{ form_values.email if form_values else '' }}" autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding:13px; margin-top:6px;">Log In</button>
    </form>

    <p class="auth-footer-note">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
